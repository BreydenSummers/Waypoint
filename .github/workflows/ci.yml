name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: waypoint
          POSTGRES_USER: waypoint
          POSTGRES_PASSWORD: waypoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U waypoint -d waypoint"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      WAYPOINT_TEST_PG_DSN: postgres://waypoint:waypoint@localhost:5432/waypoint?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        run: npm install --prefix web

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Smoke test production binary
        run: make smoke
